<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>匿名问答箱 · 预览</title>
  <style>
    :root { --ink:#2c2416; --muted:#8a8174; --bg:#f7f1e8; --card:#fff8ee; --accent:#a33b2b; --anon:#5b6e8c; --env:#f4e6d0; --flap:#e8d5bc; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; background: #dccfb8; color: var(--ink); }
    .phone { width: min(420px, 100%); min-height: 100vh; margin: 0 auto; background: var(--bg); position: relative; padding-bottom: 96px; }
    .bar { padding: 14px 20px 4px; font-weight: 700; color: var(--muted); font-size: 13px; }
    .page { display: none; padding: 8px 16px 24px; }
    .page.on { display: block; }
    .muted { color: var(--muted); font-size: 13px; }
    .btn { height: 44px; border: 0; border-radius: 999px; font-weight: 600; cursor: pointer; width: 100%; font-size: 15px; }
    .primary { background: var(--accent); color: #fff; }
    .ghost { background: #efe6d6; }
    input { width: 100%; border: 0; background: #fffbf4; border-radius: 12px; padding: 12px; font: inherit; }
    textarea { width: 100%; border: 0; background: transparent; font: inherit; min-height: 110px; resize: vertical; font-family: "KaiTi", "STKaiti", serif; font-size: 16px; line-height: 28px; }
    .tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; width: min(392px, calc(100% - 28px)); height: 64px; background: #fffbf4; border-radius: 22px; display: flex; border: 1px solid rgba(163,59,43,.1); }
    .tabs button { flex: 1; border: 0; background: none; color: var(--muted); font-weight: 700; cursor: pointer; font-size: 12px; }
    .tabs button.on { color: var(--accent); }
    .tabs .ico { display: block; font-size: 16px; margin-bottom: 2px; }
    .mode { display: flex; gap: 8px; margin: 8px 0; }
    .mode button { flex: 1; height: 36px; border: 0; background: rgba(255,251,244,.7); font-weight: 700; cursor: pointer; }
    .mode button.on { background: var(--anon); color: #fff; }
    .mode button.on.named { background: var(--accent); }
    .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; }
    .tag-anon { background: #e8edf5; color: var(--anon); }
    .tag-named { background: #f4e4df; color: var(--accent); }
    .hi { font-size: 26px; font-weight: 800; color: var(--accent); letter-spacing: 4px; text-align: center; }
    .tagline { text-align: center; margin: 6px 0 8px; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    .search-btn { width: 72px; background: var(--accent); color: #fff; border: 0; border-radius: 12px; font-weight: 700; cursor: pointer; }
    .stamp { display: inline-block; border: 1.5px solid var(--accent); color: var(--accent); font-weight: 800; font-size: 12px; padding: 2px 8px; letter-spacing: 1px; }
    .item { cursor: pointer; }
    .status { font-size: 12px; color: var(--accent); }
    .status.done { color: #4b7a5d; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .find-strip { padding: 12px 14px 14px; border: 1px solid rgba(163,59,43,.1); margin-top: 4px; }
    .find-label { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .floor-title { font-size: 12px; color: var(--muted); margin: 6px 4px 8px; }
    .env-wrap { margin: 6px 4px 4px; }
    .flap { width: 0; height: 0; margin: 0 auto; border-left: 170px solid transparent; border-right: 170px solid transparent; border-bottom: 48px solid var(--flap); }
    .env-body { position: relative; background: var(--env); border: 1px solid rgba(163,59,43,.12); padding: 44px 18px 22px; text-align: center; min-height: 230px; }
    .wax { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: #fffbf4; display: flex; align-items: center; justify-content: center; font-weight: 800; }
    .env-body .wax { position: absolute; left: 50%; top: -23px; transform: translateX(-50%); }
    .wax.pulse { background: var(--anon); }
    .env-title { font-size: 22px; font-weight: 800; margin: 8px 0 4px; }
    .env-actions { display: flex; justify-content: center; gap: 20px; margin-top: 12px; color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; }
    .lined { background-color: #fff8ee; background-image: repeating-linear-gradient(transparent, transparent 27px, rgba(163,59,43,.12) 28px); }
    .q-hand { font-family: "KaiTi", "STKaiti", "Songti SC", serif; font-size: 17px; line-height: 28px; }
    .a-print { font-family: "Songti SC", "STSong", "SimSun", serif; font-size: 16px; font-weight: 600; }
    .sheet { background: #fff8ee; border: 1px solid rgba(163,59,43,.1); padding: 14px; margin: 10px 2px; }
    .sheet.tilt { transform: rotate(-0.6deg); }
    .sheet.tilt-r { transform: rotate(0.7deg); }
    .slips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
    .slip { flex: 1 1 42%; background: #fff8ee; border: 1px dashed #c4a574; padding: 8px 10px; font-size: 12px; color: var(--anon); cursor: pointer; }
    .write { padding: 12px; margin-bottom: 12px; border: 1px solid rgba(163,59,43,.1); }
    .hero { text-align: center; padding: 8px 0 12px; }
    .hero .wax { margin: 0 auto 10px; }
    .welcome { margin: 8px 0; }
    .wall-title { font-weight: 700; margin: 8px 4px; }
    .empty-env { text-align: center; color: var(--muted); padding: 28px 8px; }
    .env-mini { width: 92px; height: 56px; margin: 0 auto 8px; background: var(--env); border: 1px solid rgba(163,59,43,.18); position: relative; }
    .env-mini::before { content: ""; position: absolute; left: 0; right: 0; top: 0; border-left: 46px solid transparent; border-right: 46px solid transparent; border-top: 26px solid var(--flap); }
    .modal { position: fixed; inset: 0; background: rgba(44,36,22,.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 24px; }
    .modal.on { display: flex; }
    .poster { width: 280px; min-height: 400px; padding: 28px 22px 32px; position: relative; }
    .poster .wax { position: absolute; top: 14px; right: 14px; }
    .poster .q-hand { margin: 48px 0 16px; min-height: 84px; }
    .owner-bar { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; margin: 8px 0; }
    .link { color: var(--accent); font-weight: 600; cursor: pointer; }
    .seal { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; }
    h3 { margin: 16px 4px 8px; font-size: 15px; }
    .card { background: var(--card); padding: 14px; margin-bottom: 10px; border: 1px solid rgba(163,59,43,.08); }
  </style>
</head>
<body>
  <div class="phone">
    <div id="login" class="page on">
      <div style="padding:56px 20px 0;text-align:center">
        <div class="seal" style="margin:0 auto 16px">匿</div>
        <div class="hi">匿名信箱</div>
        <p class="muted">说出你不敢公开说的话</p>
        <div class="card" style="margin-top:28px;text-align:left"><input id="nick" placeholder="填写昵称（署名时才会显示）" /></div>
        <button class="btn primary" onclick="login()">拆开进入</button>
      </div>
    </div>

    <div id="home" class="page">
      <div class="hi">匿名信箱</div>
      <p class="muted tagline">说出你不敢公开说的话</p>
      <div id="mine"></div>
      <div class="floor-title">可以这样问进别人的信封</div>
      <div class="slips" id="homeSlips"></div>
      <div class="find-strip lined">
        <div class="find-label">找一只信箱</div>
        <div class="row">
          <input id="kw" type="number" placeholder="写下邮戳，例如 1" />
          <button class="search-btn" onclick="search()">拆开</button>
        </div>
      </div>
    </div>

    <div id="inbox" class="page">
      <div class="bar">来信</div>
      <div id="pauseBar"></div>
      <div class="mode">
        <button class="on" id="t1" onclick="setInbox('unanswered')">未拆</button>
        <button id="t2" onclick="setInbox('answered')">已回</button>
        <button id="t3" onclick="setInbox('sent')">我发出的</button>
      </div>
      <div id="inboxList"></div>
    </div>

    <div id="everyone" class="page">
      <div class="bar">友人</div>
      <div class="mode">
        <button class="on" id="e1" onclick="setEvery('feed')">好友动态</button>
        <button id="e2" onclick="setEvery('friends')">朋友的信箱</button>
      </div>
      <div id="everyBody"></div>
    </div>

    <div id="mailbox" class="page">
      <div class="bar" onclick="show('home')" style="cursor:pointer">← 信封</div>
      <div id="boxBody"></div>
    </div>

    <div id="create" class="page">
      <div class="bar" onclick="show('home')" style="cursor:pointer">← 封上信箱</div>
      <p class="muted">编号会出现在信封的邮戳上。</p>
      <div class="write lined">
        <input id="boxTitle" placeholder="信箱名称" style="background:transparent" />
        <div style="height:8px"></div>
        <textarea id="boxIntro">欢迎把不敢公开说的话放进来。</textarea>
      </div>
      <button class="btn primary" onclick="createBox()">封上我的信箱</button>
    </div>

    <div id="thread" class="page">
      <div class="bar" onclick="show('inbox')" style="cursor:pointer">← 这封来信</div>
      <div id="threadBody"></div>
    </div>

    <div class="tabs" id="tabbar" style="display:none">
      <button class="on" onclick="tab('home', this)"><span class="ico">✉</span>信封</button>
      <button onclick="tab('inbox', this)"><span class="ico">▤</span>来信</button>
      <button onclick="tab('everyone', this)"><span class="ico">☰</span>友人</button>
    </div>
  </div>

  <div class="modal" id="shareModal" onclick="if(event.target===this)this.classList.remove('on')">
    <div class="poster lined" id="shareCard"></div>
  </div>

<script>
const KEY = 'anonbox_preview_v2'
const PROMPTS = ['今天过得怎么样？','有句一直没说出口的话？','最近在为什么事犹豫？','这周最想被问的一件事？','如果只能问一个问题，你会问自己什么？','有什么一直想认真回答、却很少被问到的？']
const uid = (p) => p + '_' + Math.random().toString(36).slice(2,8)
const now = () => Date.now()
function blank() {
  return { seq: 2, me: null, follows: [], users: [
    { id:'demo_forest', nickname:'林间信箱', phone:'13800000001', mailboxCode:1, contacts:[] },
    { id:'demo_night', nickname:'夜航者', phone:'13800000002', mailboxCode:2, contacts:[] }
  ], mailboxes: [
    { code:1, ownerId:'demo_forest', title:'林间信箱', intro:'把想说又不好意思说的话，放进这里。', messageCount:1, paused:false, mutedWords:[], topic:'最近有没有一直没说出口的话' },
    { code:2, ownerId:'demo_night', title:'夜航者的提问箱', intro:'匿名提问、认真回复。', messageCount:1, paused:false, mutedWords:[], topic:'' }
  ], messages: [
    { id:'m1', mailboxCode:1, fromId:'demo_night', isAnonymous:true, content:'最近有没有一件事，你很想对谁说，却一直没开口？', createdAt: now()-86400000*2, archived:false, read:true, reply:{ content:'有。所以才做了这个信箱。', createdAt: now()-86400000, visibility:'mailbox' } },
    { id:'m2', mailboxCode:2, fromId:'demo_forest', isAnonymous:true, content:'如果今天只能问一个问题，你会问自己什么？', createdAt: now()-86400000, archived:false, read:false, reply:null }
  ] }
}
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || blank() } catch(e){ return blank() } }
function save(db){ localStorage.setItem(KEY, JSON.stringify(db)); return db }
let db = load(); if (!db.seq) db = save(blank())
let inboxTab = 'unanswered', everyTab = 'feed', boxAnon = true, vis = 'private', showSettings = false

function me(){ return db.users.find(u => u.id === db.me) }
function user(id){ return db.users.find(u => u.id === id) }
function box(code){ return db.mailboxes.find(m => m.code === Number(code)) }
function visLabel(v){ return { private:'仅对方可见', mailbox:'信箱墙', everyone:'好友动态' }[v] || '' }
function emptyEnv(text){ return `<div class="empty-env"><div class="env-mini"></div><div>${text}</div></div>` }

function show(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'))
  document.getElementById(id).classList.add('on')
  document.getElementById('tabbar').style.display = ['home','inbox','everyone'].includes(id) ? 'flex' : 'none'
  if (id==='home') renderHome()
  if (id==='inbox') renderInbox()
  if (id==='everyone') renderEvery()
}
function tab(id, btn){
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'))
  btn.classList.add('on')
  show(id)
}
function login(){
  const nickname = document.getElementById('nick').value.trim() || '预览用户'
  if (!me()) {
    const u = { id: uid('u'), nickname, phone:'', mailboxCode:null, contacts:[] }
    db.users.push(u); db.me = u.id; save(db)
  }
  show('home')
  document.querySelectorAll('.tabs button')[0].classList.add('on')
}
function unread(){
  const u = me(); if (!u || !u.mailboxCode) return 0
  return db.messages.filter(m => m.mailboxCode===u.mailboxCode && !m.reply && !m.archived).length
}
function renderHome(){
  document.getElementById('homeSlips').innerHTML = PROMPTS.map(t =>
    `<div class="slip" onclick="navigator.clipboard.writeText('${t.replace(/'/g,'')}');alert('已抄下这句，去别人信封里问')">${t}</div>`
  ).join('')
  const u = me()
  const mine = u && u.mailboxCode ? box(u.mailboxCode) : null
  const n = unread()
  document.getElementById('mine').innerHTML = mine ? `
    <div class="env-wrap">
      <div class="flap"></div>
      <div class="env-body">
        <div class="wax ${n ? 'pulse' : ''}">${n ? n : '匿'}</div>
        <div class="stamp">邮戳 #${mine.code}</div>
        <div class="env-title">${mine.title}</div>
        <div class="muted">${mine.paused ? '已封口，暂停接收' : '未拆的信，写给愿意看的人'}</div>
        <button class="btn primary" style="margin-top:14px" onclick="openShare(${mine.code})">把信封发给朋友</button>
        <div class="env-actions">
          <span onclick="openBox(${mine.code})">拆开信箱</span>
          <span onclick="navigator.clipboard.writeText('${mine.code}')">复制邮戳</span>
        </div>
      </div>
    </div>` : `
    <div class="env-wrap">
      <div class="flap"></div>
      <div class="env-body">
        <div class="wax">封</div>
        <div class="env-title">还没有自己的信封</div>
        <div class="muted">封口处留下名字，别人就能把不敢说的话塞进来。</div>
        <button class="btn primary" style="margin-top:14px" onclick="show('create')">封上我的信箱</button>
      </div>
    </div>`
}
function openShare(code, qna){
  const m = box(code)
  if (qna) {
    document.getElementById('shareCard').innerHTML = `<div class="wax">匿</div><div class="stamp">#${m.code}</div>
      <div class="q-hand">${qna.q}</div><div class="a-print">${qna.a}</div>
      <p class="muted">说出你不敢公开说的话</p>`
  } else {
    document.getElementById('shareCard').innerHTML = `<div class="wax">匿</div><div class="stamp">邮戳 #${m.code}</div>
      <h2 style="margin:56px 0 8px;font-size:26px">${m.title}</h2>
      <p class="q-hand">${m.intro || '说出你不敢公开说的话'}</p>
      <p class="muted" style="margin-top:40px">截图发给微信好友</p>`
  }
  document.getElementById('shareModal').classList.add('on')
}
function search(){
  const n = Number(document.getElementById('kw').value)
  if (!box(n)) return alert('没有找到这个信箱')
  openBox(n)
}
function createBox(){
  const u = me()
  if (u.mailboxCode) return openBox(u.mailboxCode)
  db.seq += 1
  const m = { code: db.seq, ownerId: u.id, title: document.getElementById('boxTitle').value.trim() || (u.nickname+'的信箱'), intro: document.getElementById('boxIntro').value.trim(), messageCount:0, paused:false, mutedWords:[], topic:'' }
  db.mailboxes.push(m); u.mailboxCode = m.code; save(db)
  show('home'); openShare(m.code)
}
function openBox(code){
  const m = box(code), u = me(), owner = m.ownerId === u.id
  const wall = db.messages.filter(x => x.mailboxCode===m.code && x.reply && !x.archived && (x.reply.visibility==='mailbox' || x.reply.visibility==='everyone'))
  const slips = PROMPTS.map(t => `<div class="slip" onclick="document.getElementById('ask').value='${t.replace(/'/g,'')}';">${t}</div>`).join('')
  const wallHtml = wall.length ? wall.map((x,i) => `<div class="sheet ${i%2?'tilt-r':'tilt'}" onclick="openThread('${x.id}')">
      <span class="tag ${x.isAnonymous?'tag-anon':'tag-named'}">${x.isAnonymous?'匿名来信':'署名来信'}</span>
      <div class="q-hand lined" style="margin:10px 0;min-height:56px">${x.content}</div>
      <div class="a-print">${x.reply.content}</div>
    </div>`).join('') : emptyEnv('信封还是空的')
  document.getElementById('boxBody').innerHTML = `
    <div class="hero">
      <div class="wax">匿</div>
      <div class="stamp">邮戳 #${m.code}</div>
      <div class="env-title">${m.title}</div>
      <div class="welcome">${m.intro}</div>
      ${m.topic?`<div class="muted">今日主题 · ${m.topic}</div>`:''}
      <div class="link" onclick="openShare(${m.code})">把这只信封发给朋友</div>
    </div>
    ${owner ? `<div class="owner-bar"><span>来信在「来信」里回复。</span><span class="link" onclick="showSettings=!showSettings;openBox(${code})">${showSettings?'收起整理':'整理信箱'}</span></div>
      ${showSettings?`<div class="card"><button class="btn ghost" onclick="togglePause()">${m.paused?'重新打开':'暂停接收'}</button>
      <div class="row" style="margin-top:8px"><input id="mute" placeholder="屏蔽词"/><button class="search-btn" onclick="addMute()">添加</button></div></div>`:''}` :
      (m.paused ? `<div class="sheet" style="color:var(--accent);text-align:center">这只信箱暂时封口了。</div>` : `
      <div class="slips">${slips}</div>
      <div class="write lined">
        <div class="mode">
          <button class="${boxAnon?'on':''}" onclick="boxAnon=true;openBox(${code})">匿名</button>
          <button class="${!boxAnon?'on named':''}" onclick="boxAnon=false;openBox(${code})">署名</button>
        </div>
        <textarea id="ask" placeholder="在信纸上写下你不敢公开说的话"></textarea>
        <button class="btn primary" onclick="sendAsk(${code})">${boxAnon?'匿名封进信封':'署名封进信封'}</button>
      </div>`)}
    <div class="wall-title">贴在墙上的问答</div>
    ${wallHtml}`
  show('mailbox')
}
function sendAsk(code){
  const u = me(), m = box(code)
  if (m.paused) return alert('这个信箱暂时不接收新留言')
  const content = document.getElementById('ask').value.trim()
  if (!content) return alert('请写下你的留言')
  if ((m.mutedWords||[]).some(w => content.includes(w))) return alert('这句话里有信箱主人不想看到的词')
  db.messages.unshift({ id: uid('msg'), mailboxCode: Number(code), fromId: u.id, isAnonymous: boxAnon, content, createdAt: now(), archived:false, read:false, reply:null })
  m.messageCount += 1; save(db)
  alert(boxAnon ? '已匿名封进信封' : '已署名封进信封')
  openBox(code)
}
function togglePause(){ const m = box(me().mailboxCode); m.paused = !m.paused; save(db); openBox(m.code) }
function addMute(){
  const w = document.getElementById('mute').value.trim(); if (!w) return
  const m = box(me().mailboxCode); m.mutedWords = m.mutedWords || []; m.mutedWords.push(w); save(db); openBox(m.code)
}
function follow(code){
  db.follows = db.follows || []
  if (!db.follows.find(f => f.userId===db.me && f.code===Number(code))) db.follows.push({ userId: db.me, code: Number(code) })
  save(db); alert('已放入好友动态')
}
function setInbox(t){
  inboxTab = t
  ;['unanswered','answered','sent'].forEach((k,i) => document.getElementById('t'+(i+1)).className = t===k ? (k==='sent'?'on named':'on') : '')
  renderInbox()
}
function renderInbox(){
  const u = me()
  const mine = u.mailboxCode ? box(u.mailboxCode) : null
  document.getElementById('pauseBar').innerHTML = mine ? `<div class="muted" style="text-align:center;color:var(--accent);margin-bottom:8px;cursor:pointer" onclick="const b=box(me().mailboxCode);b.paused=!b.paused;save(db);renderInbox()">${mine.paused?'信封已封口 · 点此打开':'接收中 · 点此封口'}</div>` : ''
  if (inboxTab==='unanswered') {
    if (!u.mailboxCode) { document.getElementById('inboxList').innerHTML = emptyEnv('还没有自己的信封') + `<button class="btn primary" onclick="show('create')">去封上</button>`; return }
    const list = db.messages.filter(m => m.mailboxCode===u.mailboxCode && !m.reply && !m.archived)
    document.getElementById('inboxList').innerHTML = list.length ? list.map(m => itemCard(m)).join('') : emptyEnv('没有待拆的来信')
  } else if (inboxTab==='answered') {
    const list = db.messages.filter(m => m.mailboxCode===u.mailboxCode && m.reply && !m.archived)
    document.getElementById('inboxList').innerHTML = list.length ? list.map(m => itemCard(m)).join('') : emptyEnv('还没有回过信')
  } else {
    const list = db.messages.filter(m => m.fromId===u.id)
    document.getElementById('inboxList').innerHTML = list.length ? list.map(m => {
      const b = box(m.mailboxCode)
      return `<div class="sheet item" onclick="openThread('${m.id}')"><div class="between"><b>发给 #${m.mailboxCode} ${b?b.title:''}</b><span class="status ${m.reply?'done':''}">${m.reply?'对方已回复':'等待回复'}</span></div><div class="q-hand">${m.content}</div>${m.reply?`<div class="a-print">${m.reply.content}</div>`:''}</div>`
    }).join('') : emptyEnv('你还没有给别人写过')
  }
}
function itemCard(m){
  return `<div class="sheet item" onclick="openThread('${m.id}')">
    <div class="between"><span class="tag ${m.isAnonymous?'tag-anon':'tag-named'}">${m.isAnonymous?'匿名来信':'署名来信'}</span>
    <span class="status ${m.reply?'done':''}">${m.reply?visLabel(m.reply.visibility):'待拆'}</span></div>
    <div class="q-hand lined" style="margin-top:8px">${m.content}</div>
    ${m.reply?`<div class="a-print" style="margin-top:8px">${m.reply.content}</div>`:''}</div>`
}
function openThread(id){
  const m = db.messages.find(x => x.id===id), b = box(m.mailboxCode), owner = b.ownerId===db.me
  if (owner) m.read = true; save(db)
  document.getElementById('threadBody').innerHTML = `<div class="sheet">
    <span class="tag ${m.isAnonymous?'tag-anon':'tag-named'}">${m.isAnonymous?'匿名提问':'署名提问'}</span>
    <div class="q-hand lined" style="margin:12px 0">${m.content}</div>
    ${m.reply?`<div class="muted">回复 · ${visLabel(m.reply.visibility)}</div><div class="a-print">${m.reply.content}</div>
      <button class="btn primary" style="margin-top:12px" onclick="openShare(${b.code},{q:\`${m.content.replace(/`/g,'')}\`,a:\`${m.reply.content.replace(/`/g,'')}\`})">生成问答海报</button>`:''}
  </div>
  ${owner && !m.reply ? `<div class="write lined"><textarea id="rep" placeholder="在信纸上回这句"></textarea>
    <div class="mode">
      <button class="${vis==='private'?'on':''}" onclick="vis='private';openThread('${id}')">仅对方可见</button>
      <button class="${vis==='mailbox'?'on':''}" onclick="vis='mailbox';openThread('${id}')">贴上信箱墙</button>
      <button class="${vis==='everyone'?'on named':''}" onclick="vis='everyone';openThread('${id}')">给友人看</button>
    </div>
    <button class="btn primary" onclick="reply('${id}')">回这封信</button>
    <button class="btn ghost" style="margin-top:8px" onclick="mArchive('${id}')">归档</button>
  </div>` : (owner ? `<button class="btn ghost" onclick="mArchive('${id}')">归档</button>` : '')}`
  show('thread')
}
function reply(id){
  const m = db.messages.find(x => x.id===id)
  const content = document.getElementById('rep').value.trim()
  if (!content) return alert('请填写回复')
  m.reply = { content, createdAt: now(), visibility: vis }
  save(db); alert('已回复'); openThread(id)
}
function mArchive(id){
  db.messages.find(x => x.id===id).archived = true; save(db); show('inbox')
}
function setEvery(t){
  everyTab = t
  document.getElementById('e1').className = t==='feed'?'on':''
  document.getElementById('e2').className = t==='friends'?'on named':''
  renderEvery()
}
function friendCodes(){
  const u = me(); const set = new Set()
  ;(u.contacts||[]).forEach(phone => {
    const f = db.users.find(x => x.phone===phone && x.mailboxCode)
    if (f) set.add(f.mailboxCode)
  })
  ;(db.follows||[]).forEach(f => { if (f.userId===u.id) set.add(Number(f.code)) })
  if (u.mailboxCode) set.add(u.mailboxCode)
  return set
}
function renderEvery(){
  if (everyTab==='feed') {
    const codes = friendCodes()
    const list = db.messages.filter(m => m.reply && !m.archived && (m.reply.visibility==='mailbox'||m.reply.visibility==='everyone') && codes.has(m.mailboxCode))
    document.getElementById('everyBody').innerHTML = `<div class="muted" style="margin-bottom:8px">只出现你关注的人、通讯录朋友，以及你贴上墙的问答。</div>
      <div class="row" style="margin-bottom:10px"><input id="fc" type="number" placeholder="输入邮戳关注"/><button class="search-btn" onclick="follow(Number(document.getElementById('fc').value));renderEvery()">关注</button></div>
      ${list.length? list.map((m,i) => { const b=box(m.mailboxCode); return `<div class="sheet ${i%2?'tilt-r':'tilt'} item" onclick="openBox(${m.mailboxCode})"><div class="muted">#${m.mailboxCode} ${b.title}</div><div class="q-hand lined" style="margin:8px 0">${m.content}</div><div class="a-print">${m.reply.content}</div></div>` }).join('') : emptyEnv('还没有友人的公开问答。关注邮戳 1 试试。')}`
  } else {
    const friends = db.users.filter(u => u.id!==db.me && u.phone && (me().contacts||[]).includes(u.phone))
    document.getElementById('everyBody').innerHTML = `<div class="muted">更稳的是把信封海报发出去。演示号 13800000001。</div>
      <button class="btn ghost" style="margin:10px 0" onclick="addFriend()">添加朋友号码</button>
      ${friends.length? friends.map(f => `<div class="sheet item" onclick="${f.mailboxCode?`openBox(${f.mailboxCode})`:''}"><b>${f.nickname}</b><div class="muted">${f.mailboxCode?'邮戳 #'+f.mailboxCode:'还没有信封'}</div></div>`).join('') : emptyEnv('还没有匹配到朋友')}`
  }
}
function addFriend(){
  const phone = prompt('输入好友手机号','13800000001'); if (!phone) return
  const u = me(); u.contacts = u.contacts || []; if (!u.contacts.includes(phone)) u.contacts.push(phone)
  save(db); renderEvery()
}
if (db.me) { show('home'); document.getElementById('tabbar').style.display='flex' }
</script>
</body>
</html>
